name: Rust Bend 2 FFI feasibility
on:
  push:
    branches:
      - experiment/rust-bend-ffi
  workflow_dispatch:

jobs:
  validate:
    if: github.ref == 'refs/heads/experiment/rust-bend-ffi'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install system prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang binutils build-essential
      - name: Install Bend 2
        shell: bash
        run: |
          curl -fsSL https://bend-lang.com/install.sh -o /tmp/bend-install.sh
          sh /tmp/bend-install.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          clang --version
          bend version
      - name: Execute reference and Bend probes
        shell: bash
        run: bash experiments/ffi/scripts/validate.sh
      - name: Probe native Bend to Rust effect
        shell: bash
        run: bash experiments/ffi/bend-to-rust/test.sh
      - name: Benchmark bounded Rust event queue and ABI
        run: bash experiments/ffi/event-queue/test.sh
      - name: Benchmark concurrent Bend-driven queue consumption
        run: bash experiments/ffi/bend-consumer/test.sh
      - name: Transfer real event values into Bend and process them
        run: bash experiments/ffi/bend-events/test.sh
      - name: Benchmark Bend-side batches (16, 64, 256)
        run: bash experiments/ffi/bend-batches/test.sh
      - name: Test adaptive priority queue with concurrent Rust producers and Bend processing
        run: bash experiments/ffi/adaptive-parallel/test.sh
      - name: Run two independent Bend runtimes concurrently
        run: bash experiments/ffi/adaptive-parallel/test-multi-instance.sh
      - name: Upload adaptive queue results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-queue-results
          path: experiments/ffi/adaptive-parallel/out/
          if-no-files-found: warn
      - name: Upload Bend batch benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bend-batch-benchmark
          path: experiments/ffi/bend-batches/out/
          if-no-files-found: warn
      - name: Upload Bend value-transfer benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bend-value-transfer-benchmark
          path: experiments/ffi/bend-events/out/
          if-no-files-found: warn
      - name: Upload Bend consumer benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bend-consumer-benchmark
          path: experiments/ffi/bend-consumer/out/
          if-no-files-found: warn
      - name: Upload event queue benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-queue-benchmark
          path: experiments/ffi/event-queue/out/
          if-no-files-found: warn
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffi-feasibility-report
          path: experiments/ffi/out/
          if-no-files-found: warn
